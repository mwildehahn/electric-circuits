# `mimalloc-rust-sys` (a transitive dependency via `dbsp`) vendors a mimalloc whose C source
# uses `ATOMIC_VAR_INIT`, which C23 removed — and gcc >= 15 defaults to gnu23, so its build
# script fails with "implicit declaration of function 'ATOMIC_VAR_INIT'". Pin build-script C
# to gnu17 until dbsp moves off `mimalloc-rust`. Applies to `cc`-driven build scripts only.
[env]
CFLAGS = "-std=gnu17"
